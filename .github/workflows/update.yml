name: Update and deploy

# NSE posts each day's margin trading file in the evening, often a day late,
# so check twice: 10:30 pm IST and 8:30 am IST.
on:
  schedule:
    - cron: "0 17 * * 1-6"
    - cron: "0 3 * * 1-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "data/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new NSE days
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/fetch.py --days 20

      - name: Save new days to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "mtf-lens-bot"
          git config user.email "mtf-lens-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new data"; else git commit -m "Data: NSE days up to $(ls data/days/*.csv.gz | tail -1 | xargs -n1 basename | cut -c1-10)" && git push; fi

      - name: Build site
        run: python pipeline/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
